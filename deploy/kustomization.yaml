---
# Kustomize используется здесь ради одной конкретной вещи — подстановки
# образа в стадии release (Фактор 5).
#
# Почему не sed по манифесту: sed не знает YAML и с равным успехом заменит
# строку в комментарии или в чужом поле. Kustomize делает структурную
# замену — он понимает, что такое `image` в спеке контейнера.
#
# Почему не Helm: у нас нет ни матрицы окружений, ни условной логики,
# ни зависимостей-чартов. Helm за это берёт шаблонизатор поверх YAML,
# в котором отступы ломаются от одного лишнего пробела. Пока не нужен —
# не тащим.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: moodbot

resources:
  - configmap.yaml
  - deployment.yaml
  - hpa.yaml
  - pdb.yaml

# Блока `images:` здесь намеренно нет.
#
# Тег по умолчанию (для локальной выкатки `kubectl apply -k deploy/`) стоит
# прямо в deployment.yaml. А стадия release в CI строит поверх этой базы
# оверлей, который подменяет образ на digest. Если бы трансформер images
# был и в базе, и в оверлее, они бы наложились друг на друга — а порядок
# наложения трансформеров kustomize неочевиден и меняется между версиями.
# Одно место ответственности за одно решение.

# Метки, которые проставляются всем объектам.
# commonLabels попадают ещё и в selector'ы — а selector у Deployment
# неизменяем после создания. Поэтому используем labels без includeSelectors:
# метки для навигации не должны ломать выкатку.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: kustomize
